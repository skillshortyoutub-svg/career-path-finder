<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Path Finder – 12th / BCom ke baad</title><meta name="description" content="Free career report: interest, percentage aur stable/dynamic path ke hisaab se options, fees aur recommendation."><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f6fb;color:#1c2333;line-height:1.5}
.page{max-width:820px;margin:0 auto;padding:0 14px 40px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777);color:#fff;border-radius:0 0 22px 22px;padding:28px 20px 24px;margin:0 -14px 18px;text-align:center}
.hero h1{margin:8px 0 6px;font-size:1.55rem;line-height:1.25}.hero p{margin:0;opacity:.92}.badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-size:.8rem}
.sec{background:#fff;border-radius:16px;padding:18px 16px;margin:14px 0;box-shadow:0 2px 10px rgba(30,40,90,.06)}
.sec .sec{box-shadow:none;border:1px solid #eceff6;padding:14px 12px}
h2{margin:0 0 4px;font-size:1.2rem;color:#3730a3}h3{margin:14px 0 2px;font-size:1.05rem;color:#4338ca}.cap{margin:0 0 10px;color:#6b7280;font-size:.88rem}.txt{margin:8px 0}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}@media(max-width:600px){.g2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600;color:#374151}
.fld input,.fld select{font:inherit;font-weight:400;padding:11px 12px;border:1.5px solid #d6dae6;border-radius:10px;background:#fbfcff;font-size:16px}
.fld input:focus,.fld select:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px #e0e7ff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;font-size:.9rem;padding:8px 12px;border-radius:99px;border:1.5px solid #d6dae6;background:#fff;cursor:pointer}
.chip.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.seg{display:flex;background:#eef0f7;border-radius:12px;padding:4px;gap:4px;margin:6px 0 12px;flex-wrap:wrap}.seg button{flex:1;min-width:100px;font:inherit;font-size:.88rem;border:0;background:transparent;padding:9px 8px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:#4338ca;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.primary{width:100%;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;border:0;border-radius:12px;padding:14px;background:linear-gradient(90deg,#4f46e5,#db2777);cursor:pointer;margin-top:6px}
.callout{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.92rem}.callout.info{background:#eef2ff;border-left:4px solid #6366f1}.callout.warning{background:#fff7ed;border-left:4px solid #f59e0b}
.tw{overflow-x:auto;margin:10px 0;border-radius:10px;border:1px solid #eceff6}table{border-collapse:collapse;width:100%;font-size:.86rem}th{background:#f1f3fa;text-align:left;padding:8px 10px;white-space:nowrap}td{padding:8px 10px;border-top:1px solid #eef0f5;vertical-align:top}tr.em td{background:#eef2ff;font-weight:700}
@media(max-width:600px){.tw{border:0}table,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid #eceff6;border-radius:10px;margin-bottom:8px;padding:4px 0;background:#fff}td{border:0;padding:4px 10px}td::before{content:attr(data-l);display:block;font-size:.72rem;color:#6b7280;font-weight:600;text-transform:uppercase}}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700}.pill.success{background:#dcfce7;color:#166534}.pill.warning{background:#fef3c7;color:#92400e}.pill.danger{background:#fee2e2;color:#991b1b}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}.metric{background:#f5f3ff;border-radius:12px;padding:12px}.metric b{display:block;font-size:1.05rem;color:#4c1d95}.metric span{font-size:.8rem;color:#6b7280}.metric small{display:block;font-size:.75rem;color:#7c3aed}
.props{margin:0;display:grid;gap:6px}.props div{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed #eceff6}.props dt{font-weight:600;color:#6b7280;font-size:.85rem}.props dd{margin:0}@media(max-width:600px){.props div{grid-template-columns:1fr;gap:0}}
.diag{text-align:center;margin:10px 0}.node{background:#fff;border:1.5px solid #c7d2fe;border-radius:12px;padding:10px;display:flex;flex-direction:column}.node small{color:#6b7280}.node.root{display:inline-block;background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border:0;font-weight:700;padding:10px 18px}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:18px;position:relative}.branches:before{content:"";position:absolute;top:-14px;left:50%;height:10px;border-left:2px solid #c7d2fe}
.coll{border:1px solid #e5e8f2;border-radius:12px;margin:8px 0;background:#fff;overflow:hidden}.collhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:inherit;background:#fafbff;border:0;padding:12px;cursor:pointer}.collhead small{display:block;color:#6b7280;font-size:.8rem}.chev{font-size:1.4rem;color:#6366f1}.collbody{padding:4px 12px 12px}
.grp{margin-top:8px}.bars{margin:12px 0}.bar{margin:10px 0}.bl{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.track{height:12px;background:#eef0f7;border-radius:99px;overflow:hidden;margin:4px 0}.fill{height:100%;background:linear-gradient(90deg,#818cf8,#c084fc)}.bar.em .fill{background:linear-gradient(90deg,#4f46e5,#db2777)}.bar small{color:#6b7280;font-size:.78rem}
.rec{position:relative;border:1.5px solid #ddd6fe;border-radius:14px;padding:14px;margin:14px 0;background:linear-gradient(180deg,#faf5ff,#fff)}.rank{position:absolute;top:-12px;right:12px;background:#db2777;color:#fff;font-weight:800;border-radius:99px;padding:2px 12px}.rec h3{margin-top:4px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}@media(max-width:600px){.pc{grid-template-columns:1fr}}.pros,.cons{border-radius:12px;padding:10px 12px}.pros{background:#f0fdf4}.cons{background:#fff7ed}.pc h4{margin:0 0 4px}.pc ul{margin:0;padding-left:18px;font-size:.88rem}
.steps{counter-reset:s;list-style:none;padding:0}.steps li{counter-increment:s;position:relative;padding:6px 0 10px 42px}.steps li:before{content:counter(s);position:absolute;left:0;top:4px;width:30px;height:30px;border-radius:50%;background:#4f46e5;color:#fff;display:grid;place-items:center;font-weight:700}.steps b{display:block}.steps span{color:#4b5563;font-size:.9rem}
footer{text-align:center;color:#9ca3af;font-size:.8rem;margin-top:24px}
